security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            stateless: false
            provider: app_user_provider
            custom_authenticator: App\Security\GoogleAuthenticator
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                csrf_token_id: authenticate
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
         # P0.5 — L'API JSON ne doit jamais être anonyme (défense en profondeur,
         # en plus du #[IsGranted] sur les contrôleurs Api\*).
         - { path: ^/api, roles: ROLE_USER }
         - { path: ^/admin, roles: ROLE_ADMIN }
         - { path: ^/profile, roles: ROLE_USER }


             # Gestion des Ressources (Les utilisateurs doivent pouvoir voir les salles pour les réserver)
         - { path: ^/resource, roles: ROLE_USER }
         - { path: ^/schedule, roles: ROLE_ADMIN_RESSOURCE }

             # Administration Globale (Utilisateurs, configs techniques)
         - { path: ^/admin/user, roles: ROLE_SUPER_ADMIN } # Seul le Super Admin touche aux users
         - { path: ^/admin, roles: ROLE_ADMIN }


    role_hierarchy:
            # Rôles de gestionnaires (Admins de modules)
            ROLE_ADMIN_RESSOURCE: [ ]     # "Admin Gestion Ressources" (Voitures, Salles)
            ROLE_PRESTATAIRE: [ ]         # Gère ses prestations / agenda (espace /presta/provider)

            # Le Chef Suprême
            ROLE_SUPER_ADMIN:
                - ROLE_ADMIN
                - ROLE_ADMIN_RESSOURCE
                - ROLE_PRESTATAIRE         # le super-admin peut aussi accéder à l'espace prestataire (test/gestion)
                - ROLE_ALLOWED_TO_SWITCH # Optionnel : permet de se "déguiser" en un autre user pour tester

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
