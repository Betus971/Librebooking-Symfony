# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
#    upload_directory: '%kernel.project_dir%/public/uploads/images'
    # Images de ressources : doivent rester web-servies (<img src=asset(...)>).
    # Restent dans public/ mais le dossier est durci via public/uploads/.htaccess
    # (exécution PHP coupée) + validation finfo à l'upload (P0.6).
    upload_directory: '%kernel.project_dir%/public/uploads/resources'
    visitors_directory: '%kernel.project_dir%/var/uploads/visitors'
    # P0.6 — pièces jointes de réservation SORTIES du webroot : elles ne sont
    # servies que via AdminReservationController::downloadAttachment (BinaryFileResponse),
    # jamais en lien direct. Plus aucun risque d'exécution PHP via upload.
    attachments_directory: '%kernel.project_dir%/var/uploads/attachments'

    # Pagination : taille par défaut pour TOUTES les listes paginées (admin et user).
    # Injectable dans les controllers via #[Autowire(param: 'app.pagination.per_page')].
    app.pagination.per_page: 25



services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
